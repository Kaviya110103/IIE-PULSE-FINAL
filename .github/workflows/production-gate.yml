name: IIE Pulse Production Gate

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: "Production website URL"
        required: true
        default: "https://iiepulse.indrainstitute.com"
        type: string

concurrency:
  group: iie-pulse-production-gate
  cancel-in-progress: false

jobs:
  verify-production:
    name: Verify production before promotion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            MobileApp/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install mobile dependencies
        working-directory: MobileApp
        run: npm ci

      - name: Run production QA gate
        env:
          DJANGO_SECRET_KEY: github-actions-production-check
          DJANGO_DEBUG: "False"
          DATABASE_URL: ""
          DB_NAME: ""
        run: >-
          python qa/run_qa.py
          --mode production
          --live
          --production-url "${{ inputs.production_url }}"
          --strict-migrations

      - name: Upload production QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-qa-report
          path: qa/reports/
          if-no-files-found: ignore
          retention-days: 30
