name: IIE Pulse QA

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: iie-pulse-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            MobileApp/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install mobile dependencies
        working-directory: MobileApp
        run: npm ci

      - name: Configure local QA environment
        shell: bash
        run: |
          cp backend/.env.example backend/.env
          sed -i 's/^DEPLOYMENT_DOMAIN=.*/DEPLOYMENT_DOMAIN=127.0.0.1:8000/' backend/.env
          sed -i 's/^DEPLOYMENT_SCHEME=.*/DEPLOYMENT_SCHEME=http/' backend/.env
          sed -i 's/^DJANGO_ALLOWED_HOSTS=.*/DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1/' backend/.env
          cat > frontend/.env.local <<'EOF'
          VITE_API_BASE_URL=/api
          VITE_API_PROXY_TARGET=http://127.0.0.1:8000
          VITE_ALLOWED_HOSTS=localhost,127.0.0.1
          EOF

      - name: Run QA
        env:
          DJANGO_SECRET_KEY: github-actions-test-secret
          DJANGO_DEBUG: "True"
          DATABASE_URL: ""
          DB_NAME: ""
        run: python qa/run_qa.py --mode local

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: qa/reports/
          if-no-files-found: ignore
          retention-days: 14
